<script type="module">
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
const firebaseConfig = {
  apiKey: "AIzaSyD5NrCTK71Rk4qVYsQyp_t-wrf55vskEHI",
  authDomain: "stoicbare-86bfa.firebaseapp.com",
  projectId: "stoicbare-86bfa",
  storageBucket: "stoicbare-86bfa.firebasestorage.app",
  messagingSenderId: "283688843634",
  appId: "1:283688843634:web:830af8f511ed9ebabec5eb",
  measurementId: "G-6W2P37RQJ6"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

/* ---------- GOOGLE LOGIN (Firebase Auth) ----------
   Sign-in with Google creates/uses the same profile entry as the
   email login, so saved quotes live in one place. */
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut } from "firebase/auth";
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
window.__qpGoogleLogout = () => { try { store.set("qp_google", false); } catch (e) {} fbSignOut(auth).catch(() => {}); };
const googleBtn = document.getElementById("googleBtn");
if (googleBtn) googleBtn.onclick = async () => {
  const err = document.getElementById("authE");
  err.textContent = "";
  try {
    const res = await signInWithPopup(auth, googleProvider);
    const u = res.user, email = (u.email || "").toLowerCase();
    if (!email) throw new Error("Google account has no email address.");
    const prev = users[email] || {};
    users[email] = { name: u.displayName || prev.name || email.split("@")[0], h: prev.h || "", saved: prev.saved || [] };
    me = email;
    store.set("qp_users", users); store.set("qp_me", me); store.set("qp_google", true);
    document.getElementById("authD").close();
    toast("Welcome, " + users[me].name); render();
  } catch (e) {
    if (e && e.code === "auth/operation-not-allowed") err.textContent = "Google sign-in is not enabled for this project yet. Enable Google in Firebase Console → Authentication → Sign-in method.";
    else if (e && e.code === "auth/popup-closed-by-user") err.textContent = "Google sign-in was cancelled.";
    else if (e && e.code === "auth/popup-blocked") err.textContent = "The sign-in popup was blocked. Allow popups for this site and try again.";
    else if (e && e.code === "auth/unauthorized-domain") err.textContent = "This domain is not authorized for Google sign-in. Add it in Firebase Console → Authentication → Settings → Authorized domains.";
    else err.textContent = "Google sign-in failed. Please try again.";
  }
};
</script>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#17202e;--mute:#5d6878;--card:#fff;--line:#e2e6ea;--blue:#2740d6;--onblue:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font:800 24px/1 "Bricolage Grotesque";letter-spacing:-.04em;border:0;background:none;padding:0}
.logo b{color:var(--blue)}
.sp{flex:1}
.btn{border:1.5px solid var(--ink);background:none;padding:8px 16px;border-radius:99px;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.nav{border:0;background:none;padding:8px 4px;font-weight:600;color:var(--mute)}
.nav[aria-current=true]{color:var(--ink);box-shadow:inset 0 -3px var(--blue)}
.hero{padding:7vh 5vw 3vh;max-width:1100px}
.hero h1{font:400 clamp(40px,7vw,84px)/1 "DM Serif Display",serif;margin:0 0 14px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mute);max-width:46ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 5vw 22px;align-items:center}
.bar input{flex:1 1 220px;max-width:340px;padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chip{border:1.5px solid var(--line);background:none;padding:6px 14px;border-radius:99px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{columns:4 250px;column-gap:18px;padding:0 5vw 60px}
.q{break-inside:avoid;margin:0 0 18px;border-radius:6px;position:relative;overflow:hidden;cursor:pointer}
.q .face{padding:30px 24px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.q img{display:block;width:100%}
.q blockquote{margin:0;font:400 clamp(22px,2.2vw,28px)/1.18 "DM Serif Display",serif}
.q cite{font-style:normal;font-weight:600;font-size:14px;opacity:.8}
.acts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.ic{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#17202e;display:grid;place-items:center}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}
.ic.on svg{fill:#d6284a;stroke:#d6284a}
.empty{padding:10vh 5vw;color:var(--mute);max-width:50ch}
.empty h2{color:var(--ink);font:400 34px "DM Serif Display"}
dialog{border:0;border-radius:10px;padding:26px;background:var(--card);color:var(--ink);width:min(420px,92vw)}
dialog::backdrop{background:rgba(10,14,20,.6)}
dialog h2{margin:0 0 14px;font:400 30px "DM Serif Display"}
dialog label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
dialog input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.err{color:#d6284a;min-height:22px;font-size:14px;margin:8px 0 0}
.shr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.shr button{padding:11px;border:1.5px solid var(--line);background:none;border-radius:6px;font-weight:600;text-align:left}
.shr button:hover{border-color:var(--blue)}
.prev{border-radius:6px;overflow:hidden;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
footer{padding:30px 5vw 40px;color:var(--mute);border-top:1px solid var(--line);font-size:14px}
#legal{display:none;padding:7vh 5vw 60px;max-width:820px}
.legalmode #legal{display:block}
.legalmode .hero,.legalmode .bar,.legalmode #grid,.legalmode #empty{display:none!important}
#legal h1{font:400 clamp(34px,5vw,56px)/1.05 "DM Serif Display",serif;margin:0 0 6px}
#legal .upd{color:var(--mute);margin:0 0 30px;font-size:14px}
#legal h2{font:600 20px/1.3 "Bricolage Grotesque",sans-serif;margin:30px 0 8px}
#legal p,#legal li{max-width:70ch;color:var(--ink)}
#legal li{margin:4px 0}
#legal a{color:var(--blue)}
#flinks{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:14px}
#flinks a{color:var(--ink);text-decoration:none;font-weight:600}
#flinks a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="logo" id="home">Quote<b>Place</b></button>
  <button class="nav" id="navAll" aria-current="true">Browse</button>
  <button class="nav" id="navSaved" aria-current="false">Saved</button>
  <span class="sp"></span>
  <span id="who"></span>
  <button class="btn pri" id="authBtn">Log in</button>
</header>

<section class="hero" id="hero">
  <h1>Words worth keeping.</h1>
  <p>Browse quote images, save the ones that hit, and send them to whoever needs them today.</p>
</section>

<div class="bar">
  <input id="search" type="search" placeholder="Search quotes or authors" aria-label="Search">
  <span id="chips" style="display:contents"></span>
</div>

<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden></div>

<section id="legal" aria-live="polite"></section>
<footer><nav id="flinks" aria-label="Company and legal"></nav><div>© 2026 QuotePlace. Quotes belong to their authors. Image credits stay with the uploader.</div></footer>

<dialog id="authD">
  <h2 id="authT">Log in</h2>
  <button class="btn" id="googleBtn" style="width:100%;margin-top:2px">Continue with Google</button>
  <p style="text-align:center;color:var(--mute);font-size:14px;margin:8px 0 0">or with email</p>
  <div id="nameWrap" hidden><label for="fn">Name</label><input id="fn" autocomplete="name"></div>
  <label for="fe">Email</label><input id="fe" type="email" autocomplete="email">
  <label for="fp">Password</label><input id="fp" type="password" autocomplete="current-password">
  <p class="err" id="authE" role="alert"></p>
  <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
    <button class="btn pri" id="authGo">Log in</button>
    <button class="btn" id="authX" style="border-color:var(--line)">Cancel</button>
    <button class="nav" id="authSw" style="margin-left:auto">Create account</button>
  </div>
</dialog>

<dialog id="shareD">
  <h2>Share this quote</h2>
  <div class="prev" id="shPrev"></div>
  <div class="shr" id="shBtns"></div>
  <button class="btn" id="shX" style="margin-top:14px;border-color:var(--line)">Close</button>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- CONTENT ----------
   To use real images: add img:"https://your-cdn/quote-123.jpg" to any item.
   Items without img are drawn as colour cards. For thousands of quotes,
   load this list from your database/API instead of keeping it inline. */
const QUOTES=[
{t:"Well begun is half done.",a:"Aristotle",c:"Action"},
{t:"It always seems impossible until it's done.",a:"Nelson Mandela",c:"Courage"},
{t:"The only way out is through.",a:"Robert Frost",c:"Courage"},
{t:"We are what we repeatedly do.",a:"Will Durant",c:"Habits"},
{t:"Nothing in life is to be feared, only understood.",a:"Marie Curie",c:"Courage"},
{t:"Do what you can, with what you have, where you are.",a:"Theodore Roosevelt",c:"Action"},
{t:"Whatever you are, be a good one.",a:"Abraham Lincoln",c:"Life"},
{t:"Not all those who wander are lost.",a:"J.R.R. Tolkien",c:"Life"},
{t:"The unexamined life is not worth living.",a:"Socrates",c:"Wisdom"},
{t:"Fall seven times, stand up eight.",a:"Japanese proverb",c:"Courage"},
{t:"He who has a why can bear almost any how.",a:"Friedrich Nietzsche",c:"Wisdom"},
{t:"A small deed done is better than a great deed planned.",a:"Peter Marshall",c:"Action"},
{t:"Quiet the mind, and the soul will speak.",a:"Ma Jaya Sati Bhagavati",c:"Calm"},
{t:"Nature does not hurry, yet everything is accomplished.",a:"Lao Tzu",c:"Calm"},
{t:"You can't stop the waves, but you can learn to surf.",a:"Jon Kabat-Zinn",c:"Calm"},
{t:"Small habits, repeated daily, become who you are.",a:"Anonymous",c:"Habits"},
{t:"The best time to plant a tree was twenty years ago. The second best is now.",a:"Chinese proverb",c:"Action"},
{t:"Be kind, for everyone you meet is fighting a hard battle.",a:"Ian Maclaren",c:"Life"}
].map((q,i)=>({id:"q"+(i+1),...q}));
const PAL=[["#f2c6d0","#3a1020"],["#2740d6","#ffffff"],["#ffd23f","#1e1a05"],["#1f3b34","#e9f3ee"],["#ff7a59","#2b0f06"],["#cfe3f5","#102338"],["#2b2433","#f4e9ff"],["#bfe5c8","#0f2a18"]];
const col=q=>PAL[(+q.id.slice(1)*3)%PAL.length];

/* ---------- STATE ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let users=store.get("qp_users",{}), me=store.get("qp_me",null), view="all", cat="All", term="", mode="login", cur=null;
let mem={}; // fallback if storage is blocked
const saved=()=>me?(users[me]?.saved||[]):[];

/* ---------- RENDER ---------- */
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.5 5.4 5.4 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>';
const shareI='<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>';
function cardHTML(q){
  const [bg,fg]=col(q),on=saved().includes(q.id);
  const face=q.img?`<img src="${q.img}" alt="${esc(q.t)} — ${esc(q.a)}" loading="lazy">`
   :`<div class="face" style="background:${bg};color:${fg}"><blockquote>${esc(q.t)}</blockquote><cite>${esc(q.a)}</cite></div>`;
  return `<figure class="q" data-id="${q.id}">${face}<div class="acts"><button class="ic ${on?"on":""}" data-a="save" aria-label="${on?"Unsave":"Save"} quote" aria-pressed="${on}">${heart}</button><button class="ic" data-a="share" aria-label="Share quote">${shareI}</button></div></figure>`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const cats=["All",...new Set(QUOTES.map(q=>q.c))];
  $("#chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  let list=QUOTES.filter(q=>(view==="all"||saved().includes(q.id))&&(cat==="All"||q.c===cat)&&(q.t+q.a).toLowerCase().includes(term));
  $("#grid").innerHTML=list.map(cardHTML).join("");
  const e=$("#empty");
  e.hidden=list.length>0;
  if(!list.length){
    if(view==="saved"&&!me)e.innerHTML='<h2>Log in to see your saved quotes</h2><p>Your saved quotes live in your profile.</p>';
    else if(view==="saved"&&!saved().length)e.innerHTML='<h2>Nothing saved yet</h2><p>Tap the heart on any quote and it will show up here.</p>';
    else e.innerHTML='<h2>No quotes match</h2><p>Try a different word or clear the category.</p>';
  }
  $("#hero").hidden=view==="saved";
  $("#navAll").setAttribute("aria-current",view==="all");
  $("#navSaved").setAttribute("aria-current",view==="saved");
  $("#authBtn").textContent=me?"Log out":"Log in";
  $("#who").textContent=me?users[me].name:"";
}

/* ---------- AUTH (browser-only demo; swap for a real backend) ---------- */
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function openAuth(m){mode=m;$("#authT").textContent=m==="login"?"Log in":"Create account";$("#authGo").textContent=m==="login"?"Log in":"Create account";
  $("#authSw").textContent=m==="login"?"Create account":"I have an account";$("#nameWrap").hidden=m==="login";$("#authE").textContent="";
  if(!$("#authD").open)$("#authD").showModal()}
$("#authSw").onclick=()=>openAuth(mode==="login"?"signup":"login");
$("#authX").onclick=()=>$("#authD").close();
$("#authGo").onclick=async()=>{
  const email=$("#fe").value.trim().toLowerCase(),pw=$("#fp").value,err=$("#authE");
  if(!/^\S+@\S+\.\S+$/.test(email))return err.textContent="Enter a valid email address.";
  if(pw.length<6)return err.textContent="Password needs at least 6 characters.";
  const h=await hash(pw);
  if(mode==="signup"){
    if(users[email])return err.textContent="That email already has an account. Log in instead.";
    const name=$("#fn").value.trim()||email.split("@")[0];
    users[email]={name,h,saved:[]};
  }else if(!users[email]||users[email].h!==h)return err.textContent="Email or password is wrong.";
  me=email;store.set("qp_users",users);store.set("qp_me",me);
  $("#authD").close();$("#fp").value="";toast("Welcome, "+users[me].name);render();
};
$("#authBtn").onclick=()=>{if(me){if(window.__qpGoogleLogout)window.__qpGoogleLogout();me=null;store.set("qp_me",null);view="all";toast("Logged out");render()}else openAuth("login")};

/* ---------- SAVE ---------- */
function toggleSave(id){
  if(!me){openAuth("login");toast("Log in to save quotes");return}
  const s=users[me].saved,i=s.indexOf(id);
  i<0?s.push(id):s.splice(i,1);
  store.set("qp_users",users);toast(i<0?"Saved to your profile":"Removed from saved");render();
}

/* ---------- SHARE ---------- */
const link=id=>location.href.split("#")[0]+"#"+id;
function drawCanvas(q){
  const [bg,fg]=col(q),c=document.createElement("canvas");c.width=1080;c.height=1080;const x=c.getContext("2d");
  x.fillStyle=bg;x.fillRect(0,0,1080,1080);x.fillStyle=fg;x.textBaseline="top";
  let size=84;x.font=size+'px "DM Serif Display",Georgia,serif';
  const wrap=()=>{const w=q.t.split(" "),L=[];let l="";w.forEach(t=>{const n=l?l+" "+t:t;if(x.measureText(n).width>900&&l){L.push(l);l=t}else l=n});L.push(l);return L};
  let L=wrap();while(L.length*size*1.15>720&&size>40){size-=6;x.font=size+'px "DM Serif Display",Georgia,serif';L=wrap()}
  let y=140;L.forEach(s=>{x.fillText(s,90,y);y+=size*1.15});
  x.font='600 38px "Bricolage Grotesque",system-ui,sans-serif';x.fillText(q.a,90,y+40);
  x.globalAlpha=.6;x.font='700 32px "Bricolage Grotesque",system-ui,sans-serif';x.fillText("QuotePlace",90,990);
  return c;
}
function openShare(id){
  cur=QUOTES.find(q=>q.id===id);
  $("#shPrev").innerHTML=cardHTML(cur).replace(/<div class="acts">.*<\/div><\/figure>/,"</figure>");
  const u=encodeURIComponent(link(id)),t=encodeURIComponent(`“${cur.t}” — ${cur.a}`);
  const items=[
   ["WhatsApp",`https://wa.me/?text=${t}%20${u}`],["X",`https://twitter.com/intent/tweet?text=${t}&url=${u}`],
   ["Facebook",`https://www.facebook.com/sharer/sharer.php?u=${u}`],["Telegram",`https://t.me/share/url?url=${u}&text=${t}`],
   ["Pinterest",`https://pinterest.com/pin/create/button/?url=${u}&description=${t}`],["Email",`mailto:?subject=${encodeURIComponent("A quote for you")}&body=${t}%20${u}`]];
  $("#shBtns").innerHTML=items.map(([n,h])=>`<button data-u="${h}">${n}</button>`).join("")
   +'<button data-x="copy">Copy link</button><button data-x="dl">Download image</button>'
   +(navigator.share?'<button data-x="native">More apps…</button>':"");
  $("#shareD").showModal();
}
$("#shBtns").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.u)return window.open(b.dataset.u,"_blank","noopener");
  if(b.dataset.x==="copy"){try{await navigator.clipboard.writeText(link(cur.id));toast("Link copied")}catch(_){toast("Copy failed. Select the address bar instead.")}}
  if(b.dataset.x==="dl"){const c=drawCanvas(cur);c.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="quoteplace-"+cur.id+".png";a.click();toast("Image downloaded")})}
  if(b.dataset.x==="native"){try{await navigator.share({title:"QuotePlace",text:`“${cur.t}” — ${cur.a}`,url:link(cur.id)})}catch(_){}}
};
$("#shX").onclick=()=>$("#shareD").close();

/* ---------- EVENTS ---------- */
$("#grid").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.closest(".q").dataset.id;b.dataset.a==="save"?toggleSave(id):openShare(id)};
$("#chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$("#search").oninput=e=>{term=e.target.value.toLowerCase();render()};
$("#navAll").onclick=()=>{leaveLegal();view="all";render()};
$("#navSaved").onclick=()=>{leaveLegal();view="saved";render()};
$("#home").onclick=()=>{leaveLegal();view="all";cat="All";term="";$("#search").value="";render();scrollTo(0,0)};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
/* ---------- COMPANY & LEGAL PAGES ----------
   Change these details before launch. Have a lawyer review the text. */
const CO={name:"QuotePlace",email:"stoicbare@gmail.com",legal:"stoicbare@gmail.com",officer:"Grievance Officer, QuotePlace",addr:"Shimla, Himachal Pradesh, India",date:"October 19, 2026",law:"India",court:"Shimla, Himachal Pradesh"};
const L=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const S=(h,...p)=>"<h2>"+h+"</h2>"+p.map(x=>x.startsWith("<ul")?x:"<p>"+x+"</p>").join("");
const PAGES={
 about:{t:"About",h:S("What QuotePlace is","QuotePlace is a place to find quote images, save the ones you like, and share them with friends. Thousands of quotes, one tap to save, and a share button on every card.")+S("Who makes it","QuotePlace is run by a small independent team in India. We pick and upload quotes by hand and keep the site free of clutter.")+S("Say hello",`Questions, ideas or a quote you want to see? Write to <a href="mailto:${CO.email}">${CO.email}</a>.`)},

receive your account details from those platforms.")+S("6. Cookies and local storage",`We use cookies and similar storage to keep you logged in and remember settings. See the <a href="#/cookies">Cookie Policy</a>.`)+S("7. How long we keep data","We keep your account data while your account is open. If you delete your account, we remove or anonymise your personal data within 30 days, except what we must keep for legal, security or accounting reasons. Server logs are kept for a limited time, typically up to 12 months.")+S("8. Your rights","Depending on where you live, you can ask to access, correct, delete or export your data, object to or limit some processing, withdraw consent, and complain to a data protection authority. California residents can also ask what we collect and ask us not to sell or share their data; we do not sell it. To use any right, write to "+CO.email+". We may need to verify your identity first.")+S("9. Security","We use encryption in transit, hashed passwords and access controls. No system is perfectly secure, so please use a strong, unique password and tell us right away if you think your account was accessed.")+S("10. Children",`${CO.name} is not meant for children under 13. We do not knowingly collect data from them. If you are under 18, use the site only with a parent or guardian's permission where the law requires it. If you think a child has given us data, write to us and we will delete it.`)+S("11. International transfers","Our providers may store data in countries other than yours. Where required, we use safeguards such as standard contractual clauses.")+S("12. Changes","If we change this policy in a meaningful way, we will update the date above and, for big changes, tell you on the site or by email.")+S("13. Contact and grievances",`${CO.officer}, ${CO.addr}. Email: <a href="mailto:${CO.email}">${CO.email}</a>. We aim to reply within 7 days and resolve complaints within 30 days.`)},
 terms:{t:"Terms of Use",h:S("1. Agreement",`By using ${CO.name} you agree to these terms and to our <a href="#/privacy">Privacy Policy</a>. If you do not agree, please do not use the site.`)+S("2. Who can use it","You must be at least 13, and if you are under 18 you need a parent or guardian's permission where the law requires it. You must be able to form a binding contract where you live.")+S("3. Your account","Give accurate details and keep your password safe. You are responsible for everything done through your account. Tell us at once if you suspect misuse. You can delete your account at any time.")+S("4. What you may do","You may browse quotes, save them to your profile and share them using the share tools for personal, non-commercial use, as long as you keep the author and QuotePlace credit intact.")+S("5. What you may not do",L(["Copy the site in bulk, scrape it, or run bots against it without written permission.","Remove credits, watermarks or author names from quote images.","Sell, license or re-upload our images as your own work or for commercial use.","Break the law, harass others, or post hateful, abusive or infringing content.","Try to hack, overload or bypass security on the site or other accounts."]))+S("6. Content and ownership","The site design, code and our own compilation of quotes and images belong to QuotePlace. Quotes remain the property of their authors or rights holders, and images remain the property of their creators or uploaders. Nothing here transfers ownership to you. See our <a href=\"#/copyright\">Copyright and Takedown</a> page.")+S("7. Content you submit","If you send us quotes, images or feedback, you promise you have the right to do so. You give QuotePlace a free, worldwide, non-exclusive licence to display, store, adapt and share that content on the site and in promotion of it. You keep ownership.")+S("8. Third-party links","The site links to other platforms and sites. We do not control them and are not responsible for their content or policies.")+S("9. Availability and changes","We try to keep the site running but do not promise it will always be available or error-free. We may change or stop features at any time.")+S("10. Suspension","We may suspend or remove accounts that break these terms or harm the site or other people. You may stop using QuotePlace at any time.")+S("11. Disclaimer and liability",`The site is provided "as is" and "as available", with no warranties of any kind to the extent the law allows. To the fullest extent allowed by law, ${CO.name} is not liable for indirect, incidental or consequential losses, or for loss of data or profits. Nothing in these terms limits liability that cannot be limited by law.`)+S("12. Governing law",`These terms are governed by the laws of ${CO.law}. Courts in ${CO.court} have exclusive jurisdiction, except where the law of your country gives you the right to bring a claim locally.`)+S("13. Changes and contact",`We may update these terms and will change the date above when we do. Continued use means you accept the new version. Questions: <a href="mailto:${CO.legal}">${CO.legal}</a>.`)},
 cookies:{t:"Cookie Policy",h:S("What cookies are","Cookies are small files a site stores in your browser. Local storage works in a similar way. They help a site remember you.")+S("What we use",L(["<b>Essential:</b> keep you logged in and keep your saved quotes available. The site cannot work properly without these.","<b>Preferences:</b> remember choices such as your last filter.","<b>Analytics (only if turned on):</b> show us, in aggregate, which quotes and pages people use so we can improve the site. We ask for your consent first where the law requires it."]))+S("What we do not use","We do not use advertising cookies or sell data from cookies.")+S("Your choices","You can block or delete cookies and local storage in your browser settings. If you block essential ones, login and saving will not work. Share buttons open other platforms, which may set their own cookies under their own policies.")+S("Questions",`Write to <a href="mailto:${CO.email}">${CO.email}</a>.`)},

 disclaimer:{t:"Disclaimer",h:S("General information only","Quotes on QuotePlace are shared for inspiration and entertainment. We try to attribute them correctly, but many quotes are passed around without a clear source, and some are wrongly credited online. We cannot guarantee that every quote or author name is exact.")+S("Not advice","Nothing on the site is medical, legal, financial or professional advice. If you are struggling, please speak to a qualified professional or someone you trust.")+S("Links and sharing","Links to other sites and platforms are for convenience. We are not responsible for what you find there or for what other people do with a quote you share.")+S("Fix an attribution",`Think a quote is credited wrongly? Tell us at <a href="mailto:${CO.email}">${CO.email}</a> and we will check and correct it.`)},

};
const ORDER=["about","contact","privacy","terms","cookies","copyright","disclaimer"];
$("#flinks").innerHTML=ORDER.map(k=>`<a href="#/${k}">${PAGES[k].t}</a>`).join("");
function showPage(k){
  $("#legal").innerHTML=`<h1>${PAGES[k].t}</h1>`+(k==="about"||k==="contact"?"":`<p class="upd">Last updated ${CO.date}</p>`)+PAGES[k].h;
  document.body.classList.add("legalmode");document.title=PAGES[k].t+" | QuotePlace";scrollTo(0,0);
}
function leaveLegal(){
  document.body.classList.remove("legalmode");document.title="QuotePlace";
  if(/^#\//.test(location.hash))history.replaceState(null,"",location.pathname+location.search);
}
function route(){
  const m=location.hash.match(/^#\/(\w+)/);
  if(m&&PAGES[m[1]])showPage(m[1]);
  else if(document.body.classList.contains("legalmode"))leaveLegal();
}
addEventListener("hashchange",route);
render();
route();
if(location.hash&&QUOTES.some(q=>q.id===location.hash.slice(1)))openShare(location.hash.slice(1));
</script>
