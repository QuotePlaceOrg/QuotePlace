name: Deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify frozen lockfile
        run: bun install --frozen-lockfile --dry-run

      - name: Validate Wrangler config
        run: bunx wrangler deploy --dry-run --outdir /tmp/stoicbare-wrangler-dry-run

      - name: Next.js build
        run: bun run build

      - name: OpenNext Cloudflare build
        run: bunx -y @opennextjs/cloudflare@1.20.12 build

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Deploy check failed: ${sha} (${context.eventName})`;
            const body = `Cloudflare compatibility checks failed for commit ${context.sha} on ${branch}.\n\nWorkflow run: ${runUrl}\n\nReview the first failing step and its logs before merging.\n\nLabel: deploy-failed`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failed',
              per_page: 10,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-failed'],
            });
