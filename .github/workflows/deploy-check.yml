name: Deploy check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Next.js build
        run: bun run build

      - name: OpenNext Cloudflare build
        run: bunx -y @opennextjs/cloudflare@1.20.12 build

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Deploy failed: ${sha} on main`;
            const body = `Cloudflare deploy-check failed for commit ${context.sha}.\n\nWorkflow run: ${runUrl}\n\nCheck the run logs for the full error. The failing step is usually \`bun install\`, \`bun run build\`, or OpenNext build.\n\nLabel: deploy-failed`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: `open`,
              labels: `deploy-failed`,
              per_page: 10,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [`deploy-failed`],
            });
